# Multi-provider RPC endpoints — realistic free-tier shape.
#
# Point the runtime at this file with:
#   export AA_RPC_ENDPOINTS_FILE=endpoints.toml
#
# Each [[provider]] adds one weighted endpoint per chain to that chain's pool, alongside the dRPC
# primary (weight 3) and — unless AA_RPC_PUBLIC_FALLBACKS=0 — the built-in keyless public nodes
# (weight 1). Requests are spread across the pool by weight and fail over to another endpoint on error.
#
# Free-tier reality (June 2026):
#   - Alchemy & Infura free tiers serve BOTH Ethereum and Arbitrum on one stable-host key → the
#     two-chain backbone.
#   - Chainstack's free Developer plan caps deployed nodes, so you get ONE chain's endpoint. It has the
#     best per-call economics (1 RU/call, 3M/mo), so we point its single node at Arbitrum (the chain
#     that struggles most) and omit Ethereum.
#   - QuickNode's perpetual free plan is effectively one endpoint, and onboarding often hands you a
#     free *trial* with a 5-block getLogs range cap that would break our range scans — so it's left
#     commented out. Enable it single-chain only if you confirm a real (non-trial) free endpoint.
#
# API keys: a `{key}` placeholder is filled from `key_env` (or the derived `AA_RPC_KEY_<NAME>`). If that
# variable is unset you're prompted once at startup; a blank answer SKIPS that whole provider. So export
# the keys you have and press Enter past the rest:
#   export AA_RPC_KEY_ALCHEMY=...        # Alchemy API key
#   export AA_RPC_KEY_INFURA=...         # Infura API key (project id)
#   export AA_RPC_KEY_CHAINSTACK=...     # Chainstack auth key
#
# Weights are scaled to effective free-tier capacity for this eth_call/multicall-heavy workload. Net
# per-chain shares with the defaults below + dRPC(3) + 3 public nodes(1 each):
#   Ethereum  (total 12): Alchemy 4 (~33%), dRPC 3 (~25%), Infura 2 (~17%), publics ~8% each
#   Arbitrum  (total 20): Chainstack 8 (~40%), Alchemy 4 (~20%), dRPC 3 (~15%), Infura 2 (~10%), publics ~5% each

# Alchemy — both chains, stable host, key in path. Two-chain backbone.
[[provider]]
name = "alchemy"
weight = 4   # 30M CU/mo ÷ 26 CU/eth_call ≈ 1.15M calls (shared across both chains)
key_env = "AA_RPC_KEY_ALCHEMY"
ethereum = "https://eth-mainnet.g.alchemy.com/v2/{key}"
arbitrum = "https://arb-mainnet.g.alchemy.com/v2/{key}"

# Infura — both chains, stable host, project id in path. Two-chain backbone (lowest free capacity).
[[provider]]
name = "infura"
weight = 2   # 500 cr/s cap, 80 cr/eth_call: lowest effective free capacity here
key_env = "AA_RPC_KEY_INFURA"
ethereum = "https://mainnet.infura.io/v3/{key}"
arbitrum = "https://arbitrum-mainnet.infura.io/v3/{key}"

# Chainstack — Arbitrum ONLY (free Developer plan = one node). Best per-call economics, pointed at the
# bottleneck chain. The HOST is node-specific: paste your node's host from the Chainstack console (e.g.
# `nd-XXX-XXX-XXX.p2pify.com` or `arbitrum-mainnet.core.chainstack.com`) and let {key} fill the auth
# key from AA_RPC_KEY_CHAINSTACK. Note: free plan is rate-limited to ~25-30 RPS; failover absorbs bursts.
[[provider]]
name = "chainstack"
weight = 8   # 3M RU/mo @ 1 RU/call ≈ 3.0M calls, all on Arbitrum
key_env = "AA_RPC_KEY_CHAINSTACK"
arbitrum = "https://arbitrum-mainnet.core.chainstack.com/{key}"

# QuickNode — disabled by default (perpetual free is one endpoint; the trial caps getLogs to 5 blocks).
# If you confirm a real free (non-trial) endpoint, uncomment and use it for a SINGLE chain. The SUBDOMAIN
# is account-specific: replace `YOUR-ENDPOINT` with your endpoint name; {key} fills the token from
# AA_RPC_KEY_QUICKNODE. Format: https://<endpoint-name>.<network>.quiknode.pro/<token>/
# [[provider]]
# name = "quicknode"
# weight = 3   # 10M credits/mo ÷ ~20/eth_call ≈ 0.5M calls
# key_env = "AA_RPC_KEY_QUICKNODE"
# arbitrum = "https://YOUR-ENDPOINT.arbitrum.quiknode.pro/{key}/"

# Unified runtime configuration for aa-cli — copy this file, edit, and point the runtime at it:
#   export AA_CONFIG_FILE=aa.toml
#
# This file holds every MUTABLE endpoint setting. It is REQUIRED: there are no built-in endpoint
# defaults. The only things NOT in this file are:
#   - secrets (API keys): kept in the environment, substituted into the `{key}` placeholder below;
#   - immutable chain data (contract/token addresses): hardcoded in the binary.
#
# Two kinds of entry:
#   [[rpc]]      one weighted HTTP endpoint per chain (failover pool) + an optional WebSocket URL.
#   [[subgraph]] one Uniswap v4 subgraph query URL per chain (used to resolve v4 pool metadata by id).
#
# Per chain, the HTTP endpoints form a weighted pool (smooth weighted round-robin) that fails over to
# another endpoint on a retryable error; a failing endpoint is benched on an exponential cooldown. The
# WebSocket subscription channel fans out to EVERY [[rpc]] entry that declares a `ws` URL for the chain,
# concurrently — providers are redundant feeds, and duplicate deliveries are deduped downstream, so
# declare `ws` on as many providers as your plans allow.
#
# Every active chain (ethereum, arbitrum, base, optimism, polygon, bnb, avalanche) MUST end up with at
# least one HTTP endpoint and one WS URL, or startup fails. The per-chain table key (e.g. `bnb`) is the
# chain's config slug, independent of any provider's own path segment in the URL (dRPC's is `bsc`).
#
# API keys: a `{key}` placeholder in any URL is filled from the provider's key — resolved from the env
# var named by `key_env` (or the derived `AA_RPC_KEY_<NAME>` / `AA_GRAPH_KEY_<NAME>`), and if that is
# unset you are prompted once at startup. A blank answer SKIPS that whole provider. So export the keys
# you have and press Enter past the rest:
#   export AA_RPC_KEY_DRPC=...
#   export AA_RPC_KEY_ALCHEMY=...
#   export AA_RPC_KEY_INFURA=...
#   export AA_RPC_KEY_CHAINSTACK=...
#   export AA_GRAPH_API_KEY=...          # optional — omit to disable v4 metadata resolution
#
# Other env (not endpoints):
#   AA_METADATA_CACHE_PATH  on-disk metadata cache path (default: metadata-cache.redb)

# ---------------------------------------------------------------------------------------------------
# RPC providers
# ---------------------------------------------------------------------------------------------------

# dRPC — every chain, HTTP + WebSocket. The per-chain URL is `{base}/{network}/{key}`; dRPC's network
# segment for BNB is `bsc`, independent of the `bnb` config slug.
[[rpc]]
name = "drpc"
weight = 3
key_env = "AA_RPC_KEY_DRPC"
ethereum = { http = "https://lb.drpc.org/ethereum/{key}", ws = "wss://lb.drpc.org/ethereum/{key}" }
arbitrum = { http = "https://lb.drpc.org/arbitrum/{key}", ws = "wss://lb.drpc.org/arbitrum/{key}" }
base = { http = "https://lb.drpc.org/base/{key}", ws = "wss://lb.drpc.org/base/{key}" }
optimism = { http = "https://lb.drpc.org/optimism/{key}", ws = "wss://lb.drpc.org/optimism/{key}" }
polygon = { http = "https://lb.drpc.org/polygon/{key}", ws = "wss://lb.drpc.org/polygon/{key}" }
bnb = { http = "https://lb.drpc.org/bsc/{key}", ws = "wss://lb.drpc.org/bsc/{key}" }
avalanche = { http = "https://lb.drpc.org/avalanche/{key}", ws = "wss://lb.drpc.org/avalanche/{key}" }

# Alchemy — every chain, HTTP + WebSocket. Shared free CU budget across all chains; NOTE subscription
# events (newHeads + logs on 7 chains, 24/7) bill CU continuously — drop the `ws` entries if the budget
# runs hot. WS uses the same URL as HTTP with the `wss://` scheme.
[[rpc]]
name = "alchemy"
weight = 4
key_env = "AA_RPC_KEY_ALCHEMY"
ethereum = { http = "https://eth-mainnet.g.alchemy.com/v2/{key}", ws = "wss://eth-mainnet.g.alchemy.com/v2/{key}" }
arbitrum = { http = "https://arb-mainnet.g.alchemy.com/v2/{key}", ws = "wss://arb-mainnet.g.alchemy.com/v2/{key}" }
base = { http = "https://base-mainnet.g.alchemy.com/v2/{key}", ws = "wss://base-mainnet.g.alchemy.com/v2/{key}" }
optimism = { http = "https://opt-mainnet.g.alchemy.com/v2/{key}", ws = "wss://opt-mainnet.g.alchemy.com/v2/{key}" }
polygon = { http = "https://polygon-mainnet.g.alchemy.com/v2/{key}", ws = "wss://polygon-mainnet.g.alchemy.com/v2/{key}" }
bnb = { http = "https://bnb-mainnet.g.alchemy.com/v2/{key}", ws = "wss://bnb-mainnet.g.alchemy.com/v2/{key}" }
avalanche = { http = "https://avax-mainnet.g.alchemy.com/v2/{key}", ws = "wss://avax-mainnet.g.alchemy.com/v2/{key}" }

# Infura — every chain, HTTP + WebSocket. Lowest effective free capacity here, so the lowest weight.
# WS path is `/ws/v3/{key}` (unlike HTTP's `/v3/{key}`); WS on arbitrum/avalanche/bnb/optimism is Infura
# "public beta". Subscription events count against the daily credit quota — drop the `ws` entries if it
# runs hot.
[[rpc]]
name = "infura"
weight = 2
key_env = "AA_RPC_KEY_INFURA"
ethereum = { http = "https://mainnet.infura.io/v3/{key}", ws = "wss://mainnet.infura.io/ws/v3/{key}" }
arbitrum = { http = "https://arbitrum-mainnet.infura.io/v3/{key}", ws = "wss://arbitrum-mainnet.infura.io/ws/v3/{key}" }
base = { http = "https://base-mainnet.infura.io/v3/{key}", ws = "wss://base-mainnet.infura.io/ws/v3/{key}" }
optimism = { http = "https://optimism-mainnet.infura.io/v3/{key}", ws = "wss://optimism-mainnet.infura.io/ws/v3/{key}" }
polygon = { http = "https://polygon-mainnet.infura.io/v3/{key}", ws = "wss://polygon-mainnet.infura.io/ws/v3/{key}" }
bnb = { http = "https://bsc-mainnet.infura.io/v3/{key}", ws = "wss://bsc-mainnet.infura.io/ws/v3/{key}" }
avalanche = { http = "https://avalanche-mainnet.infura.io/v3/{key}", ws = "wss://avalanche-mainnet.infura.io/ws/v3/{key}" }

# Chainstack — Arbitrum ONLY (free Developer plan = one node), pointed at the bottleneck chain. The HOST
# is node-specific: paste your node's host from the Chainstack console.
[[rpc]]
name = "chainstack"
weight = 8
key_env = "AA_RPC_KEY_CHAINSTACK"
arbitrum = { http = "https://arbitrum-mainnet.core.chainstack.com/{key}" }

# Keyless public nodes — HTTP + WebSocket, weight 1, no key needed. Low-weight resilience fallbacks;
# WS is the same host with the `wss://` scheme.
[[rpc]]
name = "publicnode"
weight = 1
ethereum = { http = "https://ethereum-rpc.publicnode.com", ws = "wss://ethereum-rpc.publicnode.com" }
arbitrum = { http = "https://arbitrum-one-rpc.publicnode.com", ws = "wss://arbitrum-one-rpc.publicnode.com" }
base = { http = "https://base-rpc.publicnode.com", ws = "wss://base-rpc.publicnode.com" }
optimism = { http = "https://optimism-rpc.publicnode.com", ws = "wss://optimism-rpc.publicnode.com" }
polygon = { http = "https://polygon-bor-rpc.publicnode.com", ws = "wss://polygon-bor-rpc.publicnode.com" }
bnb = { http = "https://bsc-rpc.publicnode.com", ws = "wss://bsc-rpc.publicnode.com" }
avalanche = { http = "https://avalanche-c-chain-rpc.publicnode.com", ws = "wss://avalanche-c-chain-rpc.publicnode.com" }

# ---------------------------------------------------------------------------------------------------
# Uniswap v4 subgraphs (optional — omit, or skip the key, to disable v4 metadata resolution)
# ---------------------------------------------------------------------------------------------------

# The Graph decentralized-network gateway. v4 is deployed on every active chain; each subgraph below was
# validated against the exact query/parser schema (id, token0{id}, token1{id}, feeTier, tickSpacing,
# hooks) by issuing the client's `pools(where:{id_in:[...]})` query through the gateway — all returned a
# live pool with every field, no indexing errors, synced to head (validated 2026-06-25). Ethereum is the
# official Uniswap Labs subgraph; the rest are schema-compatible community `uniswap-v4-<chain>`
# deployments on the decentralized network (the only Uniswap v4 subgraph Uniswap Labs publishes there is
# Ethereum's). Swap any id you prefer, but re-validate the schema first: several similarly-named
# subgraphs (e.g. the spaced "Uniswap V4 Ethereum") use an incompatible schema (`Pool` has no `token0`).
# A chain omitted here simply skips v4 metadata resolution — v4 event discovery still runs. The gateway
# carries its key in the path, so `{key}` is filled from AA_GRAPH_API_KEY. Add same-schema mirrors as
# extra [[subgraph]] entries with their own key_env to fail over alongside it.
[[subgraph]]
name = "thegraph"
weight = 3
key_env = "AA_GRAPH_API_KEY"
# ethereum: official "uniswap-v4-ethereum" (Uniswap Labs); others: community deployments.
# arbitrum: "uniswap-v4-arbitrum-one" (replaced 2026-07-10; the older G5Ts… deployment's indexers all
#   went unhealthy). base: "uni-v4-flaunch" (replaced 2026-07-10; the whole "uniswap-v4-base" family
#   sat on one broken indexer fleet — despite the name it indexes ALL Base v4 pools; validated against
#   on-chain PoolManager Initialize logs).
ethereum = "https://gateway.thegraph.com/api/{key}/subgraphs/id/DiYPVdygkfjDWhbxGSqAQxwBKmfKnkWQojqeM2rkLb3G"
arbitrum = "https://gateway.thegraph.com/api/{key}/subgraphs/id/EpEZyTnADuwvqpMh7vcTPFHDN3MwqiUN9QHapCBPbRWW"
base = "https://gateway.thegraph.com/api/{key}/subgraphs/id/GqkCvwH9i1UZqkGVtFqkC12kMBcE1pgk5Fo9s2J2Fowc"
optimism = "https://gateway.thegraph.com/api/{key}/subgraphs/id/6RBtsmGUYfeLeZsYyxyKSUiaA6WpuC69shMEQ1Cfuj9u"
polygon = "https://gateway.thegraph.com/api/{key}/subgraphs/id/CwpebM66AH5uqS5sreKij8yEkkPcHvmyEs7EwFtdM5ND"
bnb = "https://gateway.thegraph.com/api/{key}/subgraphs/id/EAq1nJKgjnuKH6Gj4RFjCW7LcL7E2uipbncdwV7TTWkX"
avalanche = "https://gateway.thegraph.com/api/{key}/subgraphs/id/49JxRo9FGxWpSf5Y5GKQPj5NUpX2HhpoZHpGzNEWQZjq"

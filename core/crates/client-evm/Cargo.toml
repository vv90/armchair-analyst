[package]
name = "client-evm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
alloy = { version = "2.0.5", default-features = false, features = ["std", "sol-types", "serde", "rpc-types-eth"] }
imbl = "7.0.1"
optimization = { path = "../optimization" }
redb = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }

[features]
test-support = []

[dev-dependencies]
proptest = "1"
criterion = "0.5"

# Scaling microbenchmarks for the kernel's O(window) read paths. `required-features` gates the
# target on `test-support` (which exposes the non-consuming bench read shims on `State`), so a plain
# `cargo bench` skips it and `cargo bench --features test-support --bench kernel_scaling` runs it.
[[bench]]
name = "kernel_scaling"
harness = false
required-features = ["test-support"]

[lints]
workspace = true

[package]
name = "aa-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
client-evm = { path = "../client-evm" }
aa-framework = { path = "../aa-framework" }
aa-wire = { path = "../aa-wire" }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
tiny_http = "0.12.0"
arc-swap = "1.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[dev-dependencies]
client-evm = { path = "../client-evm", features = ["test-support"] }

[lints]
workspace = true

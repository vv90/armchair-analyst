[package]
name = "aa-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
client-evm = { path = "../client-evm" }
aa-framework = { path = "../aa-framework" }
optimization = { path = "../optimization" }
ratatui = "0.29"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.8"
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
client-evm = { path = "../client-evm", features = ["test-support"] }
serde_json = "1.0.150"

[lints]
workspace = true
